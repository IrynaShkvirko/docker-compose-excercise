services:
  web:
    image: ${SERVER_IP}:8081/docker-excercise/my-static-site:1.0
    build: .
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3