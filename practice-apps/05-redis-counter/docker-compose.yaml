services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ${SERVER_IP}:8081/docker-excercise/my-redis-counter:1.0
    platform: linux/amd64
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RATE_LIMIT: ${RATE_LIMIT}
      RATE_WINDOW_SECONDS: ${RATE_WINDOW_SECONDS}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  redisinsight-data:
