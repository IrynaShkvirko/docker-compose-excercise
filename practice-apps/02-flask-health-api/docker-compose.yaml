services:
  flask-health-api:
    image: ${SERVER_IP}:8081/docker-excercise/my-flask-health-api:1.0
    platform: linux/amd64
    environment:
      PORT: ${PORT}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT','5000') + '/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  pinger:
    image: curlimages/curl
    depends_on:
      flask-health-api:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: >
      while true; do
        curl -sS http://flask-health-api:${PORT}/health || true;
        echo;
        sleep 2;
      done