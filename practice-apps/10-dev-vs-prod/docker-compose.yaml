services:
  web:
    image: ${SERVER_IP}:8081/docker-excercise/my-dev-vs-prod:1.0
    build: .
    platform: linux/amd64
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      GREETING: ${GREETING}
      PORT: "5000"
    ports:
      - "${PORT}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pinger:
    image: curlimages/curl
    profiles: ["tools"]
    entrypoint: ["sh", "-c"]
    command: ["while true; do curl -sS http://web:5000/health || true; echo; sleep 5; done"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
